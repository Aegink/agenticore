name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (strict)
        run: npm run check

      - name: Test suite
        run: npm test

      - name: Architecture governance
        run: npm run architecture:check

      - name: Kernel edge invariants
        run: npm run kernel:edges

      - name: Model catalog sync
        run: npm run models:check
